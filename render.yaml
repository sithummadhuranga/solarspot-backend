
services:
  - type: web
    name: solarspot-api
    runtime: node
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    autoDeploy: false
    healthCheckPath: /api/health
    region: oregon
    plan: free
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      - key: MONGODB_URI
        sync: false          # full Atlas URI including the database path, e.g. mongodb+srv://user:pass@cluster0.abcde.mongodb.net/solarspot?retryWrites=true&w=majority

      - key: APP_NAME
        value: SolarSpot

      - key: APP_URL
        sync: false

      - key: MONGODB_DB_NAME
        value: solarspot

      - key: JWT_SECRET
        generateValue: true  # Render generates a cryptographically secure value

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: JWT_ACCESS_EXPIRES
        value: 15m

      - key: JWT_REFRESH_EXPIRES
        value: 7d

      - key: COOKIE_SECRET
        generateValue: true

      - key: FRONTEND_URL
        sync: false          # e.g. https://solarspot.vercel.app

      - key: EMAIL_TRANSPORT
        value: brevo-api

      - key: BREVO_API_KEY
        sync: false          # Brevo API key for HTTPS email sending on free Render

      - key: EMAIL_HOST
        value: smtp-relay.brevo.com

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_SECURE
        value: "false"

      - key: EMAIL_USER
        sync: false          # your Brevo login email

      - key: EMAIL_PASS
        sync: false          # your Brevo SMTP API key

      - key: EMAIL_FROM_NAME
        value: SolarSpot

      - key: EMAIL_FROM_ADDRESS
        sync: false          # e.g. no-reply@solarspot.app

      - key: EMAIL_PREVIEW
        value: "false"       # always false in production

      - key: OPENWEATHER_API_KEY
        sync: false

      - key: PERSPECTIVE_API_KEY
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false
